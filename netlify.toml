[build]
  publish = "site"
  # Skip a deploy only when nothing the app uses has changed (for example only the README).
  # Exit 0 = skip, exit 1 = build. Whenever there is any doubt (first build, unknown commit, error) it builds.
  ignore = "if [ -n \"$CACHED_COMMIT_REF\" ] && [ \"$CACHED_COMMIT_REF\" != \"$COMMIT_REF\" ] && git diff --quiet \"$CACHED_COMMIT_REF\" \"$COMMIT_REF\" -- site/ netlify/ netlify.toml package.json; then exit 0; else exit 1; fi"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
