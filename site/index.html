<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F3F7F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1816" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My Shifts">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>My Shifts</title>
<style>
:root {
  --bg: #F3F7F6; --surface: #FFFFFF; --ink: #12302B; --ink-2: #51706A; --line: #D5E2DF;
  --accent: #0F7B6C; --accent-ink: #FFFFFF; --accent-soft: #DDF1ED; --bad: #C23B3B;
  --font: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0D1816; --surface: #15251F; --ink: #E4F1EE; --ink-2: #94B0AA; --line: #284039; --accent: #3CC2AE; --accent-ink: #06201B; --accent-soft: #163A33; --bad: #F27D7D; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #0D1816; --surface: #15251F; --ink: #E4F1EE; --ink-2: #94B0AA; --line: #284039; --accent: #3CC2AE; --accent-ink: #06201B; --accent-soft: #163A33; --bad: #F27D7D; color-scheme: dark; }
html { -webkit-text-size-adjust: 100%; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.45; min-height: 100vh; }
h1, h2, p { margin: 0; }
button, input { font: inherit; color: inherit; }
.wrap { max-width: 560px; margin-inline: auto; padding: 16px max(16px, env(safe-area-inset-right, 0px)) 32px max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 14px; }
header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
header h1 { font-size: 20px; letter-spacing: -.01em; }
.status { font-size: 12.5px; color: var(--ink-2); text-align: right; }
.status.err { color: var(--bad); font-weight: 600; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0; }
.title { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); margin-bottom: 10px; }
.hi { font-size: 22px; font-weight: 700; letter-spacing: -.01em; margin-bottom: 8px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 16px; font-weight: 600; cursor: pointer; min-height: 44px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.icon { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; width: 44px; height: 44px; display: grid; place-items: center; cursor: pointer; flex: none; }
.icon svg { width: 18px; height: 18px; }
.icon:disabled { opacity: .4; }
form { display: grid; gap: 12px; }
label { display: grid; gap: 4px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
input { width: 100%; min-width: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 18px; min-height: 48px; letter-spacing: .04em; }
.msg { font-size: 14px; min-height: 20px; }
.msg.err { color: var(--bad); }
.hint { font-size: 13px; color: var(--ink-2); }
.next { display: grid; gap: 2px; }
.next b { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.next .big { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 30px; font-weight: 600; }
.next .when { color: var(--ink-2); }
.weeknav { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; }
.weeklabel { text-align: center; display: grid; }
.weeklabel strong { font-size: 17px; }
.weeklabel span { font-size: 13px; color: var(--ink-2); }
ul { list-style: none; margin: 8px 0 0; padding: 0; }
.day { display: grid; grid-template-columns: 72px 1fr; gap: 12px; align-items: center; padding: 13px 10px; border-top: 1px solid var(--line); }
.day:first-child { border-top: 0; }
.day.today { background: var(--accent-soft); border-radius: 10px; border-top-color: transparent; }
.day.today + .day { border-top-color: transparent; }
.d { display: grid; line-height: 1.2; }
.d b { font-size: 16px; }
.d span { font-size: 13px; color: var(--ink-2); }
.t { display: grid; gap: 2px; min-width: 0; }
.time { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 19px; font-weight: 600; }
.off { font-weight: 600; color: var(--ink-2); }
.none { color: var(--ink-2); opacity: .65; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row .btn { flex: 1 1 140px; }
.sllist { display: grid; gap: 8px; }
.sllist .btn { text-align: start; }
.slip { display: grid; gap: 8px; }
.slip h3 { font-size: 17px; margin: 0; }
.slip h4 { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); margin: 8px 0 0; }
.slip table { width: 100%; border-collapse: collapse; font-size: 14px; }
.slk th { text-align: left; font-weight: 500; color: var(--ink-2); padding: 4px 8px 4px 0; width: 50%; }
.slk td { text-align: right; font-variant-numeric: tabular-nums; padding: 4px 0; font-weight: 600; word-break: break-word; }
.slk tr + tr th, .slk tr + tr td { border-top: 1px solid var(--line); }
.slscroll { overflow-x: auto; }
.slt th { text-align: left; font-size: 12px; color: var(--ink-2); padding: 4px 6px; border-bottom: 1px solid var(--line); }
.slt td { padding: 5px 6px; border-bottom: 1px solid var(--line); }
.slt .n { text-align: right; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="wrap">
  <header><h1>My Shifts</h1><span id="status" class="status" role="status"></span></header>
  <main id="app"></main>
</div>
<script>
(function () {
  'use strict';
  var app = document.getElementById('app'), statusEl = document.getElementById('status');
  var KEY = 'my-shifts-v1';

  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var pad = function (n) { return String(n).padStart(2, '0'); };
  var iso = function (d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
  var parse = function (s) { var p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
  var addDays = function (s, n) { var d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
  var mondayOf = function (s) { var d = parse(s); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return iso(d); };
  var todayISO = function () { return iso(new Date()); };
  var toMin = function (t) { if (!t) return NaN; var p = t.split(':').map(Number); return p[0] * 60 + p[1]; };
  var fShort = new Intl.DateTimeFormat('en-GB', { day: 'numeric', month: 'short' });
  var fDay = new Intl.DateTimeFormat('en-GB', { weekday: 'short' });
  var fWhen = new Intl.DateTimeFormat('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  var ICON = {
    left: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
    right: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>'
  };

  /* saved: { phone, token, data, fetched } */
  var saved = null;
  var ui = { wk: mondayOf(todayISO()), phase: 'enter', step: 'phone', phone: '', msg: '', err: false, online: true, busy: false, draft: '' };

  function load() { try { var o = JSON.parse(localStorage.getItem(KEY) || 'null'); if (o && o.phone) saved = o; } catch (e) {} }
  function store() { try { localStorage.setItem(KEY, JSON.stringify(saved)); } catch (e) {} }
  function forget() { saved = null; try { localStorage.removeItem(KEY); } catch (e) {} }

  function phoneKey(p) { var d = String(p == null ? '' : p).replace(/\D/g, ''); return d.length >= 9 ? d.slice(-9) : d; }
  function sha256hex(str) {
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(str)).then(function (buf) {
      return Array.prototype.map.call(new Uint8Array(buf), function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
    });
  }
  function auth(extra) { var h = extra || {}; if (saved && saved.token) h['Authorization'] = 'Bearer ' + saved.token; return h; }
  function post(path, body, headers) {
    var h = headers || {}; h['Content-Type'] = 'application/json';
    return fetch('/api/' + path, { method: 'POST', headers: h, body: JSON.stringify(body), cache: 'no-store' });
  }
  function fetchDoc(phone) {
    return fetch('/api/schedule?phone=' + encodeURIComponent(phoneKey(phone)), { cache: 'no-store', headers: auth() }).then(function (r) {
      if (r.status === 404 || r.status === 400) return { kind: 'notfound' };
      if (r.status === 429) return { kind: 'locked' };
      if (r.status === 401) return r.json().then(function (j) { return { kind: j.error === 'setpin' ? 'setpin' : 'wrongpin' }; }, function () { return { kind: 'wrongpin' }; });
      if (!r.ok) return { kind: 'error' };
      return r.json().then(function (d) {
        return { kind: 'ok', data: { name: d.name || '', shifts: (d.shifts || []).filter(Boolean), off: (d.off || []).filter(Boolean), upd: d.upd || '', chg: d.chg || '', leave: !!d.leave } };
      });
    });
  }

  /* A payslip laid out for reading. The figures are exactly what the employer entered from their payroll. */
  function slipView(sl) {
    var m = function (x) { return x === undefined || x === null || x === '' ? '' : String(x); };
    var kv = function (rows) { return '<table class="slk">' + rows.map(function (r) { return '<tr><th scope="row">' + esc(r[0]) + '</th><td>' + esc(m(r[1])) + '</td></tr>'; }).join('') + '</table>'; };
    var el = (sl.el || []).filter(function (r) { return r && (r.d || r.v || r.h); }), de = (sl.de || []).filter(function (r) { return r && (r.d || r.v || r.tot); });
    return '<div class="slip">' +
      '<h3>' + esc(m(sl.company) || 'Payslip') + '</h3>' +
      kv([['Name', sl.fullName], ['PPS No.', sl.pps], ['Number', sl.number], ['Dept', sl.dept], ['Cost', sl.cost], ['Freq.', sl.freq], ['Period', sl.period], ['Pay Date', sl.payDate]].filter(function (r) { return m(r[1]); })) +
      '<h4>Pay Elements</h4><div class="slscroll"><table class="slt"><thead><tr><th>Description</th><th>Tax</th><th>Hours</th><th>Value</th></tr></thead><tbody>' +
      (el.length ? el.map(function (r) { return '<tr><td>' + esc(m(r.d)) + '</td><td>' + esc(m(r.t)) + '</td><td class="n">' + esc(m(r.h)) + '</td><td class="n">' + esc(m(r.v)) + '</td></tr>'; }).join('') : '<tr><td colspan="4">None</td></tr>') + '</tbody></table></div>' +
      '<h4>Deductions</h4><div class="slscroll"><table class="slt"><thead><tr><th>Description</th><th>Tax</th><th>Value</th><th>Total</th></tr></thead><tbody>' +
      (de.length ? de.map(function (r) { return '<tr><td>' + esc(m(r.d)) + '</td><td>' + esc(m(r.t)) + '</td><td class="n">' + esc(m(r.v)) + '</td><td class="n">' + esc(m(r.tot)) + '</td></tr>'; }).join('') : '<tr><td colspan="4">None</td></tr>') + '</tbody></table></div>' +
      '<h4>Summary</h4>' + kv([['Gross Pay', sl.gross], ['Total Deds', sl.totalDeds], ['Non-Tax Adjs', sl.nonTaxAdjs], ['Rounding', sl.rounding], ['Nett Pay', sl.nett], ['Pay Method', sl.method]]) +
      '<h4>Cumulative Details</h4>' + kv([['Gross Pay', sl.cGross], ['Non-Tax Deds', sl.cNonTaxDeds], ['Taxable Pay', sl.cTaxable], ['Tax Credit T.D', sl.cTaxCredit], ['Cut-Off T.D', sl.cCutOff], ['Total Tax', sl.cTotalTax]]) +
      '<h4>Tax/PRSI</h4>' + kv([['Tax Code', sl.taxCode], ['Emer. Start Per.', sl.emerStart], ['Tax Credit T.P', sl.taxCreditTP], ['Pay Rel. Code', sl.payRel], ['Total Insur. Wk.', sl.insurWk], ['Emp’er PRSI Per.', sl.erPrsiPer], ['Emp’er PRSI TD.', sl.erPrsiTD]]) +
      (m(sl.comments) ? '<h4>Comments</h4><p>' + esc(sl.comments) + '</p>' : '') + (m(sl.notes) ? '<h4>Notes</h4><p>' + esc(sl.notes) + '</p>' : '') + '</div>';
  }

  /* ---------- payslips released by the employer ---------- */
  function loadSlips() {
    if (!saved) return;
    fetch('/api/payslips?phone=' + encodeURIComponent(saved.phone), { cache: 'no-store', headers: auth() }).then(function (r) { return r.ok ? r.json() : null; }).then(function (j) {
      if (j && saved) { var had = (saved.slips || []).length; saved.slips = j.list || []; store(); if (saved.slips.length !== had || ui.slipOpen) render(); }
    }, function () {});
  }
  function slipsHTML() {
    var l = saved.slips || []; if (!l.length) return '';
    return '<section class="card"><h2 class="title">My payslips</h2><div class="sllist">' + l.map(function (x, i) {
      return '<button class="btn" data-act="slip" data-i="' + i + '">Week ' + esc(fShort.format(parse(x.wid)) + ' – ' + fShort.format(parse(addDays(x.wid, 6)))) + (x.slip && x.slip.nett ? ' · Nett ' + esc(x.slip.nett) : '') + '</button>';
    }).join('') + '</div></section>';
  }

  /* Tell the manager this person has opened their current times. */
  function markSeen() {
    if (!saved || !saved.data || !saved.data.upd || document.visibilityState !== 'visible') return;
    if (saved.seenUpd === saved.data.upd) return;
    var upd = saved.data.upd;
    post('seen', { phone: saved.phone, upd: upd }, auth())
      .then(function (r) { if (r.ok && saved) { saved.seenUpd = upd; store(); } }, function () {});
  }

  /* ---------- notifications ---------- */
  var pushOK = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
  function b64ToBytes(b64) {
    var pad = '='.repeat((4 - b64.length % 4) % 4), raw = atob((b64 + pad).replace(/-/g, '+').replace(/_/g, '/')), out = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
    return out;
  }
  function pushOn() {
    ui.pushMsg = 'Turning on…'; ui.pushErr = false; render();
    Notification.requestPermission().then(function (perm) {
      if (perm !== 'granted') throw new Error('denied');
      return Promise.all([navigator.serviceWorker.ready, fetch('/api/push-key', { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error('key'); return r.json(); })]);
    }).then(function (a) {
      return a[0].pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(a[1].key) });
    }).then(function (sub) {
      return post('subscribe', { phone: saved.phone, sub: sub.toJSON() }, auth());
    }).then(function (r) {
      if (!r.ok) throw new Error('save');
      saved.push = true; store(); ui.pushMsg = ''; render();
    }).catch(function (e) {
      ui.pushErr = true;
      ui.pushMsg = e && e.message === 'denied' ? 'Notifications are blocked for this app. Allow them in your phone settings, then try again.' : 'Could not turn notifications on. Try again in a moment.';
      render();
    });
  }
  function pushHTML() {
    if (saved.push && pushOK && Notification.permission === 'granted') return '<p class="hint">Notifications are on. You will be told when your times change.</p>';
    if (!pushOK) return '<p class="hint">To get a notification when your times change: add this app to your Home Screen, then open it from there.</p>';
    return '<section class="card"><p style="margin-bottom:10px">Get a notification when your manager changes your times.</p>' +
      '<button class="btn primary" data-act="push-on">Turn on notifications</button>' +
      '<p class="msg' + (ui.pushErr ? ' err' : '') + '" role="status">' + esc(ui.pushMsg || '') + '</p></section>';
  }

  function refresh(manual) {
    if (!saved || ui.busy) return;
    ui.busy = true; setStatus(manual ? 'Updating…' : '');
    fetchDoc(saved.phone).then(function (res) {
      ui.busy = false; ui.online = true;
      if (res.kind === 'ok') { saved.data = res.data; saved.fetched = Date.now(); store(); ui.phase = 'show'; ui.msg = ''; markSeen(); loadSlips(); }
      else if (res.kind === 'notfound') {
        forget(); ui.phase = 'enter'; ui.step = 'phone'; ui.err = true; ui.msg = 'That phone number is not on the staff list. Check with your manager that they saved your number.';
      } else if (res.kind === 'setpin' || res.kind === 'wrongpin') {
        var ph = saved.phone, had = !!saved.token; forget(); ui.phone = ph; ui.phase = 'enter'; ui.step = res.kind === 'setpin' ? 'new' : 'pin'; ui.err = had;
        ui.msg = res.kind === 'setpin' ? (had ? 'Your code was reset by your manager. Make a new one.' : '') : (had ? 'That code is not right. Try again.' : '');
      } else if (res.kind === 'locked') {
        var ph2 = saved.phone; forget(); ui.phone = ph2; ui.phase = 'enter'; ui.step = 'pin'; ui.err = true; ui.msg = 'Too many wrong tries. Wait 15 minutes, or ask your manager to reset your code.';
            } else { ui.online = false; if (!saved.data) { ui.phase = 'enter'; ui.err = true; ui.msg = 'Could not load your times. Try again in a moment.'; } }
      render();
    }, function () {
      ui.busy = false; ui.online = false;
      if (!saved.data) { ui.phase = 'enter'; ui.err = true; ui.msg = 'No internet connection. Connect and try again.'; }
      render();
    });
  }

  function setStatus(t, err) { statusEl.textContent = t || ''; statusEl.className = 'status' + (err ? ' err' : ''); }

  function nextShift(d) {
    var now = Date.now(), best = null;
    (d.shifts || []).forEach(function (x) {
      if (!x.i) return;
      var st = new Date(x.d + 'T' + x.i + ':00'); if (isNaN(st.getTime())) return;
      var dur = x.o ? toMin(x.o) - toMin(x.i) : 600;
      if (dur <= 0) dur += 1440;
      if (st.getTime() + dur * 60000 <= now) return;
      if (!best || st.getTime() < best.st.getTime()) best = { s: x, st: st, live: st.getTime() <= now };
    });
    return best;
  }
  var times = function (x) { return x.i + ' – ' + (x.o || '…'); };

  function enterHTML() {
    var msg = '<p class="msg' + (ui.err ? ' err' : '') + '" role="status">' + esc(ui.busy ? 'One moment…' : ui.msg) + '</p>';
    if (ui.step === 'new') {
      return '<form class="card" id="f" autocomplete="off"><h2 class="title">Make your code</h2>' +
        '<p class="hint">Choose a code only you know, 4 or more numbers or letters. You will need it if you change phone.</p>' +
        '<label>Your new code<input id="pin" type="password" inputmode="text" autocomplete="new-password" minlength="4" maxlength="40"></label>' +
        '<label>The same code again<input id="pin2" type="password" inputmode="text" autocomplete="new-password" minlength="4" maxlength="40"></label>' +
        '<button class="btn primary" type="submit">Save and show my times</button>' + msg +
        '<button class="btn" type="button" data-act="back">Use a different number</button></form>';
    }
    if (ui.step === 'pin') {
      return '<form class="card" id="f" autocomplete="off"><h2 class="title">Your code</h2>' +
        '<label>Enter your code<input id="pin" type="password" inputmode="text" autocomplete="current-password" maxlength="40"></label>' +
        '<button class="btn primary" type="submit">Show my times</button>' + msg +
        '<p class="hint">Forgot it? Ask your manager to reset your code, then make a new one here.</p>' +
        '<button class="btn" type="button" data-act="back">Use a different number</button></form>';
    }
    return '<form class="card" id="f" autocomplete="off"><h2 class="title">Your work times</h2>' +
      '<label>Your phone number<input id="code" type="tel" inputmode="tel" autocomplete="tel" placeholder="085 123 4567" value="' + esc(ui.draft) + '"></label>' +
      '<button class="btn primary" type="submit">Next</button>' + msg +
      '<p class="hint">Enter the phone number your manager has for you.</p></form>';
  }
  function showHTML() {
    if (ui.slipOpen !== undefined && ui.slipOpen !== null && (saved.slips || [])[ui.slipOpen]) {
      return '<button class="btn" data-act="slip-back" style="justify-self:start">Back to my times</button><section class="card">' + slipView(saved.slips[ui.slipOpen].slip || {}) + '</section>';
    }
    var d = saved.data, today = todayISO(), wk = ui.wk, minWk = mondayOf(addDays(today, -14)), maxWk = addDays(mondayOf(today), 56), nx = nextShift(d);
    var h = '<section class="card"><p class="hi">Hi ' + esc(d.name) + '</p>' + (d.leave ? '<p class="hint" style="margin-bottom:8px"><strong>You are marked as on leave.</strong> Tell your manager when you are back.</p>' : '') + (nx ?
      '<div class="next"><b>' + (nx.live ? 'Working now' : 'Next shift') + '</b><span class="big">' + esc(times(nx.s)) + '</span><span class="when">' + esc(fDay.format(nx.st) + ' ' + fShort.format(nx.st)) + '</span></div>' :
      '<p class="hint">No upcoming shifts recorded yet.</p>') + '</section>';
    h += '<section class="card"><div class="weeknav"><button class="icon" data-act="prev" aria-label="Previous week"' + (wk <= minWk ? ' disabled' : '') + '>' + ICON.left + '</button>' +
      '<div class="weeklabel"><strong>' + esc(fShort.format(parse(wk)) + ' – ' + fShort.format(parse(addDays(wk, 6)))) + '</strong><span>' + (wk === mondayOf(today) ? 'This week' : 'Monday to Sunday') + '</span></div>' +
      '<button class="icon" data-act="next" aria-label="Next week"' + (wk >= maxWk ? ' disabled' : '') + '>' + ICON.right + '</button></div><ul>';
    for (var i = 0; i < 7; i++) {
      var ds = addDays(wk, i), dt = parse(ds);
      var list = d.shifts.filter(function (x) { return x.d === ds; });
      var body = list.length ? list.map(function (x) { return '<span class="time">' + esc(times(x)) + '</span>'; }).join('') :
        (d.off.indexOf(ds) > -1 ? '<span class="off">Day off</span>' : '<span class="none">Not scheduled</span>');
      h += '<li class="day' + (ds === today ? ' today' : '') + '"><div class="d"><b>' + fDay.format(dt) + '</b><span>' + fShort.format(dt) + '</span></div><div class="t">' + body + '</div></li>';
    }
    h += '</ul></section><div class="row"><button class="btn" data-act="this">This week</button><button class="btn" data-act="refresh">Refresh</button></div>' + slipsHTML() + pushHTML() +
      '<section class="card"><p style="margin-bottom:10px">Worked a day that is not shown here?</p><button class="btn" data-act="ask">Tell my manager my hours are missing</button><p class="msg' + (ui.askErr ? ' err' : '') + '" role="status">' + esc(ui.askMsg || '') + '</p></section>';
    var upd = d.upd ? new Date(d.upd) : null;
    h += '<p class="hint">' + (ui.online ? '' : 'You are offline. Showing the last times saved on this phone. ') +
      (upd && !isNaN(upd.getTime()) ? 'Updated by your manager ' + esc(fWhen.format(upd)) + '. ' : '') +
      'Ask your manager if something looks wrong.</p>' +
      '<button class="btn" data-act="switch" style="justify-self:start">Log out</button>';
    return h;
  }
  function render() {
    if (ui.err && ui.phase === 'show') setStatus(ui.msg, true); else if (!ui.busy) setStatus(ui.online ? '' : 'Offline');
    app.style.display = 'grid'; app.style.gap = '14px';
    app.innerHTML = ui.phase === 'show' && saved && saved.data ? showHTML() : enterHTML();
  }

  function fail(m) { ui.busy = false; ui.err = true; ui.msg = m; render(); }
  document.addEventListener('submit', function (e) {
    if (e.target.id !== 'f') return;
    e.preventDefault();
    if (ui.busy) return;
    if (ui.step === 'phone') {
      var v = document.getElementById('code').value; ui.draft = v;
      if (phoneKey(v).length < 7) return fail('Enter your full phone number.');
      ui.busy = true; ui.err = false; ui.msg = ''; render();
      post('enter', { phone: phoneKey(v) }).then(function (r) {
        if (r.status === 404) return fail('That phone number is not on the staff list. Check with your manager that they saved your number.');
        if (!r.ok) return fail('Could not check your number. Try again in a moment.');
        return r.json().then(function (j) { ui.busy = false; ui.phone = phoneKey(v); ui.step = j.hasPin ? 'pin' : 'new'; ui.msg = ''; ui.err = false; render(); var el = document.getElementById('pin'); if (el) el.focus(); });
      }, function () { fail('No internet connection. Connect and try again.'); });
      return;
    }
    var pin = document.getElementById('pin').value, isNew = ui.step === 'new';
    if (pin.length < 4) return fail('Use 4 or more numbers or letters.');
    if (isNew && pin !== document.getElementById('pin2').value) return fail('The two codes are not the same.');
    ui.busy = true; ui.err = false; ui.msg = ''; render();
    sha256hex('shifts:' + ui.phone + ':' + pin).then(function (tok) {
      var go = function () { saved = { phone: ui.phone, token: tok, data: null, fetched: 0 }; store(); ui.busy = false; refresh(true); render(); };
      if (!isNew) return go();
      return post('setpin', { phone: ui.phone }, { 'Authorization': 'Bearer ' + tok }).then(function (r) {
        if (r.status === 409) { ui.step = 'pin'; return fail('This number already has a code. Enter it, or ask your manager to reset it.'); }
        if (!r.ok) return fail('Could not save your code. Try again in a moment.');
        go();
      });
    }).catch(function () { fail('No internet connection. Connect and try again.'); });
  });
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b) return;
    var a = b.getAttribute('data-act');
    if (a === 'prev') { ui.wk = addDays(ui.wk, -7); render(); }
    else if (a === 'next') { ui.wk = addDays(ui.wk, 7); render(); }
    else if (a === 'this') { ui.wk = mondayOf(todayISO()); render(); }
    else if (a === 'refresh') refresh(true);
    else if (a === 'push-on') pushOn();
    else if (a === 'slip') { ui.slipOpen = Number(b.getAttribute('data-i')); render(); window.scrollTo(0, 0); }
    else if (a === 'slip-back') { ui.slipOpen = null; render(); }
    else if (a === 'ask') {
      ui.askMsg = 'Sending…'; ui.askErr = false; render();
      post('ask', { phone: saved.phone }, auth()).then(function (r) {
        return r.json().then(function (j) {
          if (!r.ok) throw new Error('x');
          ui.askErr = false; ui.askMsg = j.already ? 'Your manager was already told a short while ago.' : 'Your manager has been told.'; render();
        });
      }).catch(function () { ui.askErr = true; ui.askMsg = 'Could not send. Try again in a moment.'; render(); });
    }
    else if (a === 'switch' || a === 'back') { forget(); ui.phase = 'enter'; ui.step = 'phone'; ui.draft = ''; ui.err = false; ui.msg = ''; render(); }
  });
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && saved) { markSeen(); refresh(false); } });
  window.addEventListener('online', function () { if (saved) refresh(false); });
  setInterval(function () { if (document.visibilityState === 'visible' && saved) refresh(false); }, 300000);

  /* start */
  load();
  if (saved) { ui.phase = saved.data ? 'show' : 'enter'; render(); ui.busy = false; refresh(false); }
  else render();
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) { navigator.serviceWorker.register('sw.js').catch(function () {}); }
})();
</script>
</body>
</html>
