<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0E1A2E" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C121D" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My Shifts">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<title>My Shifts Manager</title>
<style>
html { -webkit-text-size-adjust: 100%; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
[hidden] { display: none !important; }
img { max-width: 100%; }
/* Layout: one narrow ledger column built for a phone. Sticky tab bar on top; a week is a stack of
   totals, one pay card per employee, then the sign-in log. Numbers set in Plex Mono like a pay slip. */
:root {
  --bg: #F3F5F9;
  --surface: #FFFFFF;
  --surface-2: #EBF0F7;
  --ink: #14213A;
  --ink-2: #566580;
  --line: #D8DFEA;
  --accent: #2468C8;
  --accent-ink: #FFFFFF;
  --accent-soft: #E1ECFB;
  --good: #1B8656;
  --bad: #C23B3B;
  --bad-soft: #FBE6E6;
  --font-body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-num: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1420; --surface: #172033; --surface-2: #1F2A42; --ink: #E8EDF6; --ink-2: #9CA9C1;
    --line: #2B3750; --accent: #5C9DF2; --accent-ink: #0A111D; --accent-soft: #1B2C4A;
    --good: #4CC38A; --bad: #F27D7D; --bad-soft: #3A2127; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1420; --surface: #172033; --surface-2: #1F2A42; --ink: #E8EDF6; --ink-2: #9CA9C1;
  --line: #2B3750; --accent: #5C9DF2; --accent-ink: #0A111D; --accent-soft: #1B2C4A;
  --good: #4CC38A; --bad: #F27D7D; --bad-soft: #3A2127; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; min-height: 100vh; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 10; }
h1, h2, h3, p { margin: 0; }
button, input, select { font: inherit; color: inherit; }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.col { max-width: 760px; margin-inline: auto; width: 100%; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-2); }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--bg); border-bottom: 1px solid var(--line); }
.top-in { padding-block: 12px 10px; display: grid; gap: 10px; }
.bar { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.bar h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.status { font-size: 12px; color: var(--ink-2); text-align: right; }
.status.err { color: var(--bad); font-weight: 600; }
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 3px; }
.tab { border: 0; background: transparent; padding: 8px 2px; border-radius: 8px; font-weight: 600; font-size: 13px; color: var(--ink-2); cursor: pointer; }
.tab[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(10, 20, 40, .12); }

main { padding-block: 16px 96px; display: grid; gap: 16px; align-content: start; }

/* shared pieces */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; min-width: 0; }
.sec-title { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); margin-bottom: 10px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 9px 14px; font-weight: 600; cursor: pointer; min-height: 40px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .5; cursor: default; }
.icon { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; width: 40px; height: 40px; display: grid; place-items: center; cursor: pointer; color: var(--ink); flex: none; }
.icon.danger { color: var(--bad); }
.icon svg { width: 18px; height: 18px; display: block; }
button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.field { display: grid; gap: 4px; min-width: 0; }
.field > span { font-size: 12px; font-weight: 600; color: var(--ink-2); }
input[type="text"], input[type="number"], input[type="date"], input[type="time"], input[type="email"], input[type="password"], input[type="tel"], select {
  width: 100%; min-width: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 16px; min-height: 40px;
}
input.num { text-align: right; }
.hint { font-size: 12.5px; color: var(--ink-2); }
.msg { font-size: 13px; min-height: 18px; }
.msg.err { color: var(--bad); }
.empty { text-align: center; padding: 26px 16px; display: grid; gap: 10px; justify-items: center; color: var(--ink-2); }
.empty strong { color: var(--ink); font-size: 16px; }

/* week navigation */
.weeknav { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; }
.weeklabel { text-align: center; display: grid; }
.weeklabel strong { font-size: 17px; letter-spacing: -0.01em; }
.weeklabel span { font-size: 12.5px; color: var(--ink-2); }
.navtools { display: flex; gap: 10px; align-items: end; flex-wrap: wrap; margin-top: 12px; }
.navtools .field { flex: 1 1 160px; }

/* totals */
.tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
@media (min-width: 560px) { .tiles { grid-template-columns: repeat(4, 1fr); } }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 0; }
.tile span { font-size: 12px; font-weight: 600; color: var(--ink-2); display: block; }
.tile b { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: 19px; font-weight: 600; display: block; overflow-wrap: anywhere; }
.tile.main { background: var(--accent-soft); border-color: transparent; }

/* pay cards */
.pay { display: grid; gap: 12px; }
.pay-head { display: flex; justify-content: space-between; gap: 12px; align-items: start; }
.pay-head h3 { font-size: 17px; font-weight: 700; overflow-wrap: anywhere; }
.pay-head p { font-size: 13px; color: var(--ink-2); }
.rate { width: 112px; flex: none; }
.warn { font-size: 12px; font-weight: 600; color: var(--bad); }
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px 12px; margin: 0; }
@media (min-width: 480px) { .stats { grid-template-columns: repeat(4, 1fr); } }
.stats dt { font-size: 12px; font-weight: 600; color: var(--ink-2); }
.stats dd { margin: 0; font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: 15px; font-weight: 500; }
.stats dd small { display: block; font-size: 11.5px; color: var(--ink-2); font-family: var(--font-body); min-height: 15px; }
.stats .total dd { font-weight: 600; font-size: 16px; }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: end; padding-top: 12px; border-top: 1px dashed var(--line); }
.bank { display: grid; gap: 4px; }
.bank > span { font-size: 12px; font-weight: 600; color: var(--ink-2); }
.bank strong { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: 17px; min-height: 40px; display: flex; align-items: center; justify-content: flex-end; }
.pay.over .bank strong { color: var(--bad); }
.pay.over .split { border-top-color: var(--bad); }
.overnote { grid-column: 1 / -1; font-size: 12.5px; color: var(--bad); font-weight: 600; }

/* sign-in */
.chips { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 6px 0; display: grid; justify-items: center; cursor: pointer; min-width: 0; }
.chip span { font-size: 11.5px; color: var(--ink-2); font-weight: 600; }
.chip b { font-family: var(--font-num); font-size: 15px; font-weight: 600; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); }
.chip[aria-pressed="true"] span, .chip[aria-pressed="true"] b { color: var(--accent-ink); }
.addform { display: grid; gap: 12px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.shifts { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.shift { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding-top: 10px; border-top: 1px solid var(--line); }
.shift:first-child { border-top: 0; padding-top: 0; }
.shift .who { font-weight: 600; overflow-wrap: anywhere; }
.shift .times { grid-column: 1 / -1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 64px; gap: 8px; align-items: center; }
.shift .times input[type="date"] { grid-column: 1 / -1; }
.shift .hrs { text-align: right; font-weight: 600; }
.shift .del { grid-column: 2; grid-row: 1; }

details.rules summary { cursor: pointer; font-weight: 600; }
details.rules .grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-top: 12px; }

/* daily entry */
.tiles.two { grid-template-columns: repeat(2, 1fr); }
.dayrow { display: grid; gap: 12px; }
.dr-head { display: flex; justify-content: space-between; align-items: start; gap: 12px; }
.dr-head h3 { font-size: 17px; font-weight: 700; overflow-wrap: anywhere; }
.dr-head p { font-size: 13px; color: var(--ink-2); }
.dr-head .hrs { font-size: 20px; font-weight: 600; }
.dr-times { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.dayrow input[type="time"] { min-height: 46px; font-size: 18px; }
.dr-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.dr-actions .btn { flex: 1 1 0; }
.dr-actions .btn:first-child { flex-basis: 100%; }
.dayrow.isoff { background: var(--surface-2); }
.dayrow.isoff .hrs { color: var(--ink-2); }
input:disabled { opacity: .5; }
.dayhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; }
.dayhead .sec-title { margin: 0; }
.weekso { display: grid; gap: 12px; }

.tabs[hidden] { display: none; }
/* staff view */
.svnext { display: grid; gap: 2px; }
.svnext b { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.svnext .big { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: 24px; font-weight: 600; }
.svnext .when { color: var(--ink-2); }
.svdays { list-style: none; margin: 0; padding: 0; display: grid; }
.svday { display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: center; padding: 12px 10px; border-top: 1px solid var(--line); }
.svday:first-child { border-top: 0; }
.svday.today { background: var(--accent-soft); border-radius: 8px; border-top-color: transparent; }
.svday.today + .svday { border-top-color: transparent; }
.svd { display: grid; line-height: 1.2; }
.svd b { font-size: 15px; }
.svd span { font-size: 12.5px; color: var(--ink-2); }
.svt { display: grid; gap: 2px; min-width: 0; }
.svtime { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: 17px; font-weight: 600; }
.svoff { font-weight: 600; color: var(--ink-2); }
.svnone { color: var(--ink-2); opacity: .65; }

/* weekly timetable */
.tt-wrap { overflow-x: auto; }
.tt { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 620px; font-size: 13px; }
.tt th, .tt td { padding: 8px 6px; text-align: center; border-bottom: 1px solid var(--line); vertical-align: top; white-space: nowrap; }
.tt thead th { font-size: 12px; font-weight: 600; color: var(--ink-2); line-height: 1.25; }
.tt th:first-child, .tt td:first-child { position: sticky; left: 0; z-index: 1; background: var(--surface); text-align: left; min-width: 84px; max-width: 120px; overflow: hidden; text-overflow: ellipsis; font-weight: 600; font-size: 13px; border-right: 1px solid var(--line); color: var(--ink); }
.tt thead th:first-child { color: var(--ink-2); font-size: 12px; }
.tt td b { display: block; font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: 14px; font-weight: 600; }
.tt td small { display: block; font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: 11px; color: var(--ink-2); line-height: 1.35; }
.tt .off { font-size: 12px; font-weight: 600; color: var(--ink-2); }
.tt .none { color: var(--ink-2); opacity: .5; }
.tt th.today { color: var(--accent); }
.tt td.today { background: var(--accent-soft); }
.tt tbody tr:last-child th, .tt tbody tr:last-child td { border-bottom: 1px solid var(--line); }
.tt tfoot th, .tt tfoot td { border-bottom: 0; background: var(--surface-2); font-family: var(--font-num); font-variant-numeric: tabular-nums; font-weight: 600; }
.tt tfoot th:first-child { font-family: var(--font-body); }

/* monthly report */
.mstats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 12px 0 0; }
.mstats dt { font-size: 12px; font-weight: 600; color: var(--ink-2); }
.mstats dd { margin: 0; font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: 15px; font-weight: 500; overflow-wrap: anywhere; }
.mstats .total dd { font-weight: 600; }

/* staff + history */
.staffrow { display: grid; gap: 12px; }
.staffrow .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.staffrow .fields .field:first-child, .staffrow .fields .field:nth-child(4), .staffrow .fields .field:nth-child(5) { grid-column: 1 / -1; }
.staffrow .foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13.5px; }
.hist { width: 100%; text-align: left; cursor: pointer; display: grid; gap: 8px; }
.hist-head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.hist-head strong { font-size: 15.5px; }
.hist-nums { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.hist-nums span { display: block; font-size: 11.5px; color: var(--ink-2); font-weight: 600; }
.hist-nums b { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: 13.5px; font-weight: 500; overflow-wrap: anywhere; }
@media (max-width: 420px) { .hist-nums { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

.nudge { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; background: var(--accent-soft); border-color: transparent; }
.nudge p { margin-top: 2px; }
input[type="file"] { font-size: 14px; width: 100%; min-width: 0; }
input[type="time"], input[type="date"] { -webkit-appearance: none; appearance: none; display: block; min-width: 0; max-width: 100%; }
input[type="time"]::-webkit-date-and-time-value, input[type="date"]::-webkit-date-and-time-value { text-align: center; }
.staffrow .fields .coderow { grid-column: 1 / -1; display: grid; gap: 8px; background: var(--surface-2); border-radius: 8px; padding: 10px; }
.coderow .cl { display: block; font-size: 12px; font-weight: 600; color: var(--ink-2); }
.coderow .cv { font-size: 17px; letter-spacing: .04em; word-break: break-all; }
.coderow .cbtns { display: flex; gap: 8px; flex-wrap: wrap; }
.coderow .cbtns .btn { flex: 1 1 120px; }
.hint.seen:empty { display: none; }
.branchbar select { font-weight: 600; }
/* six tabs and the branch picker are too tall to pin to the top of a phone */
.top { position: static; }
.authcard { display: grid; gap: 12px; margin-top: 8px; }
.authh { font-size: 20px; margin: 0; }
.authlinks { display: grid; gap: 8px; }
details > summary.btn { list-style: none; text-align: center; }
details > summary.btn::-webkit-details-marker { display: none; }
.slitem { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.slitem:first-child { border-top: 0; padding-top: 0; }
.slitem strong { display: block; }
.field small.hint { font-weight: 400; }
.fields2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.slrow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.slrow:first-of-type { border-top: 0; padding-top: 0; }
.slrow .btn { grid-column: 1 / -1; }
.slip { display: grid; gap: 8px; }
.slip h3 { font-size: 17px; margin: 0; }
.slip h4 { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); margin: 8px 0 0; }
.slip table { width: 100%; border-collapse: collapse; font-size: 14px; }
.slk th { text-align: left; font-weight: 500; color: var(--ink-2); padding: 4px 8px 4px 0; width: 50%; }
.slk td { text-align: right; font-variant-numeric: tabular-nums; padding: 4px 0; font-weight: 600; word-break: break-word; }
.slk tr + tr th, .slk tr + tr td { border-top: 1px solid var(--line); }
.slscroll { overflow-x: auto; }
.slt th { text-align: left; font-size: 12px; color: var(--ink-2); padding: 4px 6px; border-bottom: 1px solid var(--line); }
.slt td { padding: 5px 6px; border-bottom: 1px solid var(--line); }
.slt .n { text-align: right; font-variant-numeric: tabular-nums; }
.brrow { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: end; }
.hint.seen.wait { color: var(--bad); font-weight: 600; }
.hint.seen.ok { color: var(--good); font-weight: 600; }

/* toast */
.toast { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: center; padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); pointer-events: none; }
.toast-in { pointer-events: auto; background: var(--ink); color: var(--bg); border-radius: 10px; padding: 10px 14px; display: flex; gap: 14px; align-items: center; font-size: 14px; box-shadow: 0 6px 24px rgba(0, 0, 0, .25); }
.toast-in button { background: transparent; border: 0; color: var(--accent-soft); font-weight: 700; cursor: pointer; padding: 4px 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: no-preference) { .toast-in { animation: up .18s ease-out; } @keyframes up { from { transform: translateY(8px); opacity: 0; } } }
/* ===== My Shifts: premium theme =====
   Layout: a dark brand header (business name, branch), the work in calm white cards on warm paper,
   and a fixed app bar at the bottom for the six sections. Navy and brass are the brand; money totals
   sit on a dark navy tile so the number that matters reads first. */
:root {
  --bg: #F4F2ED;
  --surface: #FFFFFF;
  --surface-2: #F1EEE7;
  --ink: #101828;
  --ink-2: #5E6573;
  --line: #E6E2D9;
  --accent: #14243F;
  --accent-ink: #FFFFFF;
  --accent-soft: #EEF1F6;
  --brand: #0E1A2E;
  --brand-2: #1B2C49;
  --brand-ink: #F5F1E6;
  --brass: #B98A33;
  --brass-soft: #F6EEDC;
  --good: #1E7F55;
  --bad: #B83A33;
  --bad-soft: #F9E7E4;
  --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 10px 28px -16px rgba(16, 24, 40, .28);
  --font-body: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-num: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #090D14; --surface: #121925; --surface-2: #19212F; --ink: #EEF0F4; --ink-2: #9AA2B1; --line: #242D3C;
    --accent: #D9B263; --accent-ink: #191206; --accent-soft: #231E14; --brand: #0C121D; --brand-2: #172235; --brand-ink: #F2ECDD;
    --brass: #D9B263; --brass-soft: #2A2316; --good: #55C391; --bad: #F08A80; --bad-soft: #3A2124;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px -16px rgba(0, 0, 0, .7); color-scheme: dark;
  }
}
:root[data-theme="dark"] {

<script>
(function () {

  /* ---------- state + storage ---------- */

  var DB = null, mode = 'loading';
  var loaded = { staff: false, weeks: false };

  var pending = {}, chains = {};

  var SVKEY = 'weekly-staff-pay-code';

  function canon(o) {
    return JSON.stringify(o, function (k, v) {

    return ch;
  }

  function buildSchedule(sid) {

  }
  /* ---------- online: publish schedules to the staff app + automatic backup (same site, /api/) ---------- */
  var API = '/api/';
  var netRun = { timer: null, running: false, again: false, lastSig: '' };
  function netCfg() { return getSettings().net || {}; }
  function netSet(patch) { var f = netCfg(); Object.keys(patch).forEach(function (k) { f[k] = patch[k]; }); setSetting('net', f); return f; }

    var schedules = {};
    Object.keys(state.staff).forEach(function (sid) { var k = phoneKey(state.staff[sid].phone); if (k.length >= 7 && !schedules[k]) schedules[k] = buildSchedule(sid); });

  /* ---------- daily entry ---------- */

    });

    else if (act === 'sv-switch') { svReset(); try { localStorage.removeItem(SVKEY); } catch (e) {} render(); }
    else if (act === 'sv-preview') { ui.preview = true; svReset(); render(); window.scrollTo(0, 0); }
    else if (act === 'sv-exit') { ui.preview = false; svReset(); render(); }
    else if (act === 'm-prev') { ui.month = addMonths(ui.month, -1); render(); }
    else if (act === 'm-next') { ui.month = addMonths(ui.month, 1); render(); }
    else if (act === 'm-this') { ui.month = todayISO().slice(0, 7); render(); }
    else if (act === 'd-prev') { ui.day = addDays(ui.day, -1); render(); }
    else if (act === 'd-next') { ui.day = addDays(ui.day, 1); render(); }
    else if (act === 'd-today') { ui.day = todayISO(); render(); }
    else if (act === 'd-usual') { var sdu = cardSid(b), u1 = usualFor(sdu); setDayTimes(sdu, u1.inT, u1.outT); refreshDay(); }
    else if (act === 'd-clear') { setDayTimes(cardSid(b), '', ''); refreshDay(); }
    else if (act === 'd-off') { var so = cardSid(b); if (isOff(dayWid(), so, ui.day)) setOff(so, false); else markOff(so); refreshDay(); }
    else if (act === 'd-fill-all') {
      sortedStaff().filter(function (e) { return !onLeave(e[1], ui.day); }).forEach(function (e) { if (!findShift(dayWid(), e[0], ui.day) && !isOff(dayWid(), e[0], ui.day)) { var u2 = usualFor(e[0]); setDayTimes(e[0], u2.inT, u2.outT); } });
      refreshDay();
    }
    else if (/^(code|fb|sup|br|leave|slip|auth|team|acct)-/.test(act)) fbAct(act, b);
    else if (act === 'bk-email') backupEmail();
    else if (act === 'bk-save') { if (downloadBackup()) { markBackup(); ui.bkMsg = 'Backup file saved to your phone.'; ui.bkErr = false; } else { ui.bkMsg = 'Could not create the backup file.'; ui.bkErr = true; } render(); }
    else if (act === 'bk-restore-yes') restoreApply();
    else if (act === 'bk-restore-no') { ui.restore = null; render(); }
    else if (act === 'add-shift') addShift();
    else if (act === 'del-shift') {
      var li = b.closest('.shift'), id = li.getAttribute('data-id'), w = state.weeks[ui.wid];
      var idx = w.shifts.findIndex(function (s) { return s.id === id; });
      if (idx > -1) { undoShift = { wid: ui.wid, shift: w.shifts.splice(idx, 1)[0] }; queueSave('weeks', ui.wid, 0); render(); toast('Shift removed', 'Undo', 'undo'); }
    }
    else if (act === 'undo') {
      if (undoShift) { var w2 = ensureWeek(undoShift.wid); w2.shifts.push(undoShift.shift); queueSave('weeks', undoShift.wid, 0); undoShift = null; toastEl.hidden = true; render(); }
    }
    else if (act === 'add-staff') addStaff();
    else if (act === 'rm-staff') { ui.confirmRm = cardSid(b); render(); }
    else if (act === 'rm-cancel') { ui.confirmRm = null; render(); }
    else if (act === 'rm-confirm') { var sid = cardSid(b); delete state.staff[sid]; ui.confirmRm = null; queueSave('staff', sid, 0); render(); }
  });

  function addShift() {
    var f = ui.form;
    if (!f.sid || !state.staff[f.sid]) { ui.msg = 'Choose an employee first.'; ui.msgErr = true; return render(); }
    if (!f.days.length) { ui.msg = 'Pick at least one day.'; ui.msgErr = true; return render(); }
    if (!f.inT || !f.outT) { ui.msg = 'Enter the in and out times.'; ui.msgErr = true; return render(); }
    if (f.inT === f.outT) { ui.msg = 'In and out times are the same.'; ui.msgErr = true; return render(); }
    var w = ensureWeek(ui.wid), n = 0;
    f.days.slice().sort().forEach(function (i) { var dt = addDays(ui.wid, i); removeOffRaw(w, f.sid, dt); w.shifts.push({ id: uid('x'), sid: f.sid, date: dt, in: f.inT, out: f.outT }); n++; });
    f.days = []; ui.msg = n + (n === 1 ? ' shift added.' : ' shifts added.'); ui.msgErr = false;
    queueSave('weeks', ui.wid, 0); render();
  }
  function addStaff() {
    var n = ui.newStaff, name = n.name.trim();
    if (!name) { ui.staffMsg = 'Enter a name.'; return render(); }
    var order = 0; Object.keys(state.staff).forEach(function (k) { order = Math.max(order, num(state.staff[k].order)); });
    var id = uid('s');
    state.staff[id] = { name: name, position: n.position.trim(), rate: num(n.rate), bank: num(n.bank), order: order + 1, branch: curBranch() || firstBranch() };
    if (mode === 'cloud') state.staff[id].code = genCode();
    ui.newStaff = { name: '', position: '', rate: '', bank: '' }; ui.staffMsg = '';
    queueSave('staff', id, 0); render();
    var el = document.getElementById('ns-name'); if (el) el.focus();
  }

  document.addEventListener('input', function (e) {
    var t = e.target, f = t.getAttribute('data-f'); if (!f) return;
    var sid = cardSid(t);
    if (f === 'rate') { var w = ensureWeek(ui.wid); w.snap[sid] = w.snap[sid] || { name: nameOf(ui.wid, sid), position: '' }; w.snap[sid].rate = Math.max(0, num(t.value)); queueSave('weeks', ui.wid, 600); refreshNumbers(); }
    else if (f === 'bank') {
      var w1 = ensureWeek(ui.wid); w1.snap[sid] = w1.snap[sid] || { name: nameOf(ui.wid, sid), position: '', rate: 0 };
      w1.snap[sid].bank = Math.max(0, num(t.value)); delete w1.cash[sid];
      queueSave('weeks', ui.wid, 600); refreshNumbers();
    }
    else if (f.indexOf('cfg-') === 0) { var w2 = ensureWeek(ui.wid); w2.cfg[f.slice(4)] = Math.max(0, num(t.value)); queueSave('weeks', ui.wid, 600); refreshNumbers(); }
    else if (f === 'st-name' || f === 'st-position' || f === 'st-rate' || f === 'st-bank') {
      var s = state.staff[sid]; if (!s) return;
      if (f === 'st-name') s.name = t.value; else if (f === 'st-position') s.position = t.value;
      else if (f === 'st-rate') s.rate = Math.max(0, num(t.value)); else s.bank = Math.max(0, num(t.value));
      queueSave('staff', sid, 600);
    }
    else if (f === 'ns-name') ui.newStaff.name = t.value;
    else if (f === 'ns-position') ui.newStaff.position = t.value;
    else if (f === 'ns-rate') ui.newStaff.rate = t.value;
    else if (f === 'ns-bank') ui.newStaff.bank = t.value;
    else if (f === 'bk-email') setSetting('email', t.value.trim());
  });
  document.addEventListener('change', function (e) {
    var t = e.target, f = t.getAttribute('data-f'); if (!f) return;
    if (f === 'jump') { if (t.value) { ui.wid = mondayOf(t.value); ui.form.days = []; ui.msg = ''; render(); } }
    else if (f === 'd-in' || f === 'd-out') {
      var card = t.closest('.dayrow');
      setDayTimes(card.getAttribute('data-sid'), card.querySelector('[data-f="d-in"]').value, card.querySelector('[data-f="d-out"]').value);
      refreshDay();
    }
    else if (f === 'd-jump') { if (t.value) { ui.day = t.value; render(); } }
    else if (f === 'st-code') {
      var cs = cardSid(t), curS = state.staff[cs]; if (!curS) return;
      var v = t.value.trim(), mEl = t.closest('.staffrow').querySelector('[data-m="code"]');
      var clash = Object.keys(state.staff).some(function (k) { return k !== cs && state.staff[k].code === v; });
      var why = !/^\d{4,8}$/.test(v) ? 'A code is 4 to 8 digits.' : clash ? 'Another employee already has this code.' : '';
      if (why) { mEl.textContent = why; mEl.hidden = false; t.value = curS.code || ''; }
      else { mEl.hidden = true; if (v !== curS.code) { curS.code = v; queueSave('staff', cs, 300); } }
    }
    else if (f === 'bk-file') readBackupFile(t);
    else if (fbInput(f, t)) { }
    else if (f === 'f-sid') ui.form.sid = t.value;
    else if (f === 'f-in') ui.form.inT = t.value;
    else if (f === 'f-out') ui.form.outT = t.value;
    else if (f.indexOf('s-') === 0) {
      var li = t.closest('.shift'), w = state.weeks[ui.wid]; if (!li || !w) return;
      var s = w.shifts.find(function (x) { return x.id === li.getAttribute('data-id'); }); if (!s) return;
      var key = f === 's-date' ? 'date' : f === 's-in' ? 'in' : 'out';
      if (!t.value) { t.value = s[key]; return; }
      if (key === 'date' && (t.value < ui.wid || t.value > addDays(ui.wid, 6))) { t.value = s.date; return; }
      s[key] = t.value; queueSave('weeks', ui.wid, 300); refreshNumbers();
    }
  });

  /* ---------- backup ---------- */
  var LSS = 'weekly-staff-pay-settings-v1';
  function getSettings() { try { return JSON.parse(localStorage.getItem(LSS) || '{}') || {}; } catch (e) { return {}; } }
  function setSetting(k, v) { var o = getSettings(); o[k] = v; try { localStorage.setItem(LSS, JSON.stringify(o)); } catch (e) {} }
  function hasData() { return Object.keys(state.staff).length > 0 || Object.keys(state.weeks).length > 0; }
  function backupAge() { var t = getSettings().lastBackup; return t ? Math.floor((Date.now() - t) / 86400000) : null; }
  function markBackup() { setSetting('lastBackup', Date.now()); }
  function nudgeHTML() {
    if (!hasData()) return '';
    if (fbOn()) return netCfg().err ? '<section class="card nudge"><div><strong>Online backup has a problem</strong><p class="hint">' + esc(netCfg().err) + '</p></div><button class="btn primary" data-act="tab" data-tab="staff">Open</button></section>' : '';
    return '<section class="card nudge"><div><strong>Automatic backup is off</strong><p class="hint">Turn it on once at the bottom of the Staff tab. Your records are then saved online after every change.</p></div><button class="btn primary" data-act="tab" data-tab="staff">Turn on</button></section>';
    var a = backupAge();
    if (a !== null && a < 7) return '';
    return '<section class="card nudge"><div><strong>' + (a === null ? 'No backup yet' : 'Last backup was ' + a + ' days ago') + '</strong>' +
      '<p class="hint">Email yourself a copy so your records are safe if you lose or change your phone.</p></div>' +
      '<button class="btn primary" data-act="tab" data-tab="backup">Back up</button></section>';
  }
  function backupPayload() { return { app: 'weekly-staff-pay', version: 1, exportedAt: new Date().toISOString(), staff: state.staff, weeks: state.weeks, branches: state.branches || {}, settings: state.settings || {} }; }
  function backupName() { return 'staff-pay-backup-' + todayISO() + '.json'; }
  function summaryText() {
    var ids = Object.keys(state.weeks).filter(function (id) { return (state.weeks[id].shifts || []).length; }).sort().reverse();
    var lines = ['Weekly Staff Pay backup, ' + todayISO(), ''];
    ids.slice(0, 4).forEach(function (id) {
      var T = totalsOf(rowsFor(id));
      lines.push(fShort.format(parse(id)) + ' – ' + fShort.format(parse(addDays(id, 6))) + ': ' + fmtHM(T.mins) + ' h, ' + eur(T.total) + ' (bank ' + eur(T.bank) + ', cash ' + eur(T.cash) + ')');
    });
    if (ids.length) {
      lines.push('', 'Latest week by employee:');
      rowsFor(ids[0]).forEach(function (r) { if (r.mins || r.total) lines.push(r.name + ': ' + fmtHM(r.mins) + ' h, ' + eur(r.total) + ' (bank ' + eur(r.bank) + ', cash ' + eur(r.cash) + ')'); });
    }
    lines.push('', 'The attached file restores everything: Backup tab, Restore from a backup file.');
    return lines.join('\n');
  }
  function downloadBackup() {
    try {
      var blob = new Blob([JSON.stringify(backupPayload(), null, 1)], { type: 'application/json' });
      var url = URL.createObjectURL(blob), a = document.createElement('a');
      a.href = url; a.download = backupName(); document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      return true;
    } catch (e) { return false; }
  }
  function backupEmail() {
    var email = (getSettings().email || '').trim(), text = summaryText(), files = null, types = ['application/json', 'text/plain'];
    try {
      if (navigator.share && navigator.canShare) {
        for (var i = 0; i < types.length && !files; i++) {
          var f = new File([JSON.stringify(backupPayload(), null, 1)], backupName(), { type: types[i] });
          if (navigator.canShare({ files: [f] })) files = [f];
        }
      }
    } catch (e) { files = null; }
    if (files) {
      navigator.share({ files: files, title: 'Staff pay backup ' + todayISO(), text: text }).then(function () {
        markBackup(); ui.bkMsg = 'Backup shared. If you chose Mail, send it to ' + (email || 'yourself') + '.'; ui.bkErr = false; render();
      }, function (err) {
        if (err && err.name === 'AbortError') { ui.bkMsg = 'Cancelled. Nothing was sent.'; ui.bkErr = false; }
        else { ui.bkMsg = 'Could not open the share sheet. Use “Save backup file” instead.'; ui.bkErr = true; }
        render();
      });
      return;
    }
    var saved = downloadBackup();
    if (saved) markBackup();
    ui.bkMsg = saved ? 'Backup file saved. Your mail app should open: attach the saved file and send.' : 'Could not create the backup file.';
    ui.bkErr = !saved; render();
    if (saved) {
      var href = 'mailto:' + encodeURIComponent(email).replace(/%40/g, '@') + '?subject=' + encodeURIComponent('Staff pay backup ' + todayISO()) +
        '&body=' + encodeURIComponent(text + '\n\n(Attach the saved file ' + backupName() + ')');
      setTimeout(function () { location.href = href; }, 400);
    }
  }
  function readBackupFile(input) {
    var f = input.files && input.files[0]; if (!f) return;
    var rd = new FileReader();
    rd.onload = function () {
      try {
        var o = JSON.parse(String(rd.result));
        if (!o || o.app !== 'weekly-staff-pay' || typeof o.staff !== 'object' || typeof o.weeks !== 'object') throw new Error('bad file');
        ui.restore = { data: o, name: f.name, staffN: Object.keys(o.staff).length, weekN: Object.keys(o.weeks).length };
        ui.bkMsg = ''; ui.bkErr = false;
      } catch (e) { ui.restore = null; ui.bkMsg = 'That file is not a Weekly Staff Pay backup.'; ui.bkErr = true; }
      render();
    };
    rd.onerror = function () { ui.bkMsg = 'Could not read that file.'; ui.bkErr = true; render(); };
    rd.readAsText(f);
  }
  function restoreApply() {
    var r = ui.restore; if (!r) return;
    Object.keys(pending).forEach(function (k) { clearTimeout(pending[k].timer); delete pending[k]; });
    state.staff = r.data.staff || {}; state.weeks = r.data.weeks || {}; state.branches = r.data.branches || {}; state.settings = r.data.settings || {}; ensureBranches(); ensureCodesLocal();
    var ok = localSave(); scheduleSync(); ui.restore = null; ui.confirmRm = null;
    ui.bkMsg = ok ? 'Restored ' + Object.keys(state.staff).length + ' employees and ' + Object.keys(state.weeks).length + ' weeks.' : 'Restored, but this device could not save it.';
    ui.bkErr = !ok; setStatus(ok ? 'saved' : 'error'); render();
  }
  function backupHTML() {
    var S = getSettings(), a = backupAge();
    var last = S.lastBackup ? new Date(S.lastBackup).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) + (a === 0 ? ' (today)' : ' (' + a + ' days ago)') : 'Never';
    var h = '<section class="card"><h2 class="sec-title">Email backup</h2><div class="addform">' +
      '<label class="field"><span>Your email</span><input type="email" id="bk-email" data-f="bk-email" inputmode="email" autocomplete="email" placeholder="name@example.com" value="' + esc(S.email || '') + '"></label>' +
      '<p class="hint">Last backup: <strong>' + esc(last) + '</strong></p>' +
      '<button class="btn primary" data-act="bk-email">Email me a backup</button>' +
      '<p class="hint">Opens your phone’s share sheet with the backup file attached. Pick Mail and send it to yourself. Do this at the end of each week.</p>' +
      '<p class="msg' + (ui.bkErr ? ' err' : '') + '" role="status">' + esc(ui.bkMsg || '') + '</p></div></section>';
    h += '<section class="card"><h2 class="sec-title">Save or restore</h2><div class="addform">' +
      '<button class="btn" data-act="bk-save">Save backup file to this phone</button>' +
      '<label class="field"><span>Restore from a backup file</span><input type="file" id="bk-file" data-f="bk-file" accept=".json,application/json,text/plain"></label>';
    if (ui.restore) {
      h += '<div class="card" style="background:var(--surface-2)"><p><strong>' + esc(ui.restore.name) + '</strong></p>' +
        '<p class="hint">Contains ' + ui.restore.staffN + ' employees and ' + ui.restore.weekN + ' weeks. Restoring replaces everything on this phone.</p>' +
        '<div style="display:flex;gap:8px;margin-top:10px"><button class="btn primary" style="flex:1" data-act="bk-restore-yes">Replace my data</button><button class="btn" style="flex:1" data-act="bk-restore-no">Cancel</button></div></div>';
    }
    h += '</div></section>' +
      '<p class="hint">Your records live on this phone. Keep the app on your home screen and back up regularly. If you clear the browser’s website data or delete the app, the records are gone unless you have a backup.</p>';
    return h;
  }

  /* ---------- start ---------- */
  mode = 'local'; localLoad(); ensureBranches(); ensureCodesLocal(); render(); setStatus('local');
  var netWake = function () { if (fbOn()) { netPoll().then(function () { return runSync(false); }); netStatus(); } };
  netWake();
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') netWake(); });
  setInterval(function () { if (document.visibilityState === 'visible' && fbOn()) netPoll(); }, 20000);
  setInterval(function () { if (document.visibilityState === 'visible' && fbOn()) netStatus(); }, 60000);
  if (navigator.storage && navigator.storage.persist) { navigator.storage.persist().catch(function () {}); }
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) { navigator.serviceWorker.register('sw.js').catch(function () {}); }
})();
</script>
</body>
</html>
